plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}
version = '2.5.3'
group = 'dev.bridgeassist'
base { archivesName = 'bridge-assist' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
jar { from('LICENSE') { rename { "${it}_${base.archivesName.get()}" } } }
tasks.register('mathTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.bridgeassist.BridgeMathTest'
}
tasks.named('check') { dependsOn 'mathTest' }
tasks.register('speedbridgeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.bridgeassist.SpeedbridgeTest'
}
tasks.named('check') { dependsOn 'speedbridgeTest' }

tasks.register('humanTimingTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.bridgeassist.HumanTimingTest'
}
tasks.named('check') { dependsOn 'humanTimingTest' }

tasks.register('placementTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.bridgeassist.PlacementTest'
}
tasks.named('check') { dependsOn 'placementTest' }

tasks.register('interactionRotationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.bridgeassist.InteractionRotationTest'
}
tasks.named('check') { dependsOn 'interactionRotationTest' }

tasks.register('faceAimTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.bridgeassist.FaceAimTest'
}
tasks.named('check') { dependsOn 'faceAimTest' }
